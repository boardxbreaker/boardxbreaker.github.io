
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>Class 10 Books | BOARDXBREAKER</title>

<style>
:root {
  color-scheme: dark;
  --bg:#080b16;
  --line:rgba(160,178,255,.16);
  --muted:#9ba6c5;
  --text:#f4f6ff;
  --cyan:#63e4ef;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  background:
  radial-gradient(ellipse at 15% 5%,rgba(63,91,210,.22),transparent 34rem),
  radial-gradient(ellipse at 88% 22%,rgba(31,191,204,.12),transparent 30rem),
  var(--bg)
}
.shell{width:min(1120px,calc(100% - 40px));margin:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.11em;font-size:15px}
.mark{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:12px;background:linear-gradient(135deg,#7192ff,#4bd5e3);
  color:#07101d;font-weight:950
}
a{color:inherit;text-decoration:none}
.back{
  color:#cbd5f5;font-size:13px;border:1px solid var(--line);
  background:rgba(110,143,255,.12);padding:10px 14px;border-radius:11px
}
main{padding:54px 0 90px}
.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:800}
h1{margin:17px 0 14px;font-size:clamp(42px,7vw,70px);line-height:1;letter-spacing:-.06em}
h1 span{
  background:linear-gradient(100deg,#fff 10%,#9bb4ff 56%,#69e4e8);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.intro{max-width:560px;color:var(--muted);font-size:15px;line-height:1.75;margin-bottom:30px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:30px 0 18px}
.search{
  width:min(420px,100%);border:1px solid var(--line);border-radius:13px;
  background:rgba(17,25,47,.82);color:var(--text);padding:14px 16px;
  font:inherit;outline:none
}
.search:focus{border-color:rgba(99,228,239,.65);box-shadow:0 0 0 3px rgba(99,228,239,.08)}
.count{color:var(--muted);font-size:12px;white-space:nowrap}
.book-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.book{
  display:flex;align-items:center;gap:14px;min-width:0;padding:17px;
  border:1px solid var(--line);border-radius:17px;
  background:linear-gradient(145deg,rgba(24,33,59,.88),rgba(13,18,34,.86));
  transition:transform .2s,border-color .2s,background .2s
}
.book:hover{
  transform:translateY(-3px);border-color:rgba(99,228,239,.42);
  background:linear-gradient(145deg,rgba(31,47,78,.96),rgba(13,23,42,.94))
}
.number{
  flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;
  border-radius:11px;background:rgba(111,145,255,.14);
  color:#a9bcff;font-size:12px;font-weight:800
}
.book-info{flex:1;min-width:0}
.book-name{font-size:13px;line-height:1.5;font-weight:700;overflow-wrap:anywhere}
.book-type{margin-top:4px;color:#8290b2;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.launch{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  padding:10px 13px;border-radius:10px;
  background:linear-gradient(110deg,#7192ff,#53d7e4);
  color:#07101d;font-size:11px;font-weight:900;letter-spacing:.04em;
  transition:filter .2s
}
.launch:hover{filter:brightness(1.12)}
.no-results{
  display:none;padding:24px;border:1px solid var(--line);
  border-radius:16px;color:var(--muted);text-align:center
}
footer{
  border-top:1px solid rgba(160,178,255,.1);padding:22px 0 30px;
  color:#73809f;font-size:11px;display:flex;justify-content:space-between;gap:12px
}
@media(max-width:680px){
  .shell{width:min(100% - 28px,560px)}
  header{padding:20px 0}
  .brand{font-size:12px}
  .back{font-size:11px;padding:9px 11px}
  main{padding:44px 0 65px}
  .book-grid{grid-template-columns:1fr}
  .book{padding:14px}
  .book-name{font-size:12px}
  .launch{padding:9px 11px;font-size:10px}
  .toolbar{align-items:flex-start;flex-direction:column}
  .count{white-space:normal}
  footer{flex-direction:column}
}
</style>
</head>

<body>
<div class="shell">

<header>
  <a class="brand" href="/">
    <span class="mark">B</span>
    <span>BOARDXBREAKER</span>
  </a>
  <a class="back" href="/books/">← BACK TO BOOKS</a>
</header>

<main>
  <div class="eyebrow">Your study library · Class 10</div>
  <h1>Class 10 <span>Books.</span></h1>
  <p class="intro">
    Explore books and study material for Class 10, all in one place.
    Choose a book and tap Launch to open it.
  </p>

  <div class="toolbar">
    <input class="search" id="bookSearch" type="search"
      placeholder="Search books by name..." aria-label="Search books">
    <div class="count" id="bookCount">23 BOOKS AVAILABLE</div>
  </div>

  <section class="book-grid" id="bookGrid" aria-label="Class 10 books"></section>
  <div class="no-results" id="noResults">No books found. Try another search.</div>
</main>

<footer>
  <span>© <span id="year"></span> BOARDXBREAKER</span>
  <span>Learn with focus. Move beyond limits.</span>
</footer>

</div>

<script>
const books = [
["1'o Clock Revison Science by Kriti Sharma","https://vplink.in/mowXP"],
["360 SST by Kriti Didi","https://vplink.in/3yA0"],
["All in One - Mathematics Class 10","https://vplink.in/G2Kw9"],
["ALL_IN_ONE_Latest_EditionSST_Class_10th","https://vplink.in/cJnK4j"],
["Arihant All in One Mathematics Class 10","https://vplink.in/jwfyyo"],
["Class 10 QCB Maths (Std), Science, SST & English Combo","https://vplink.in/TiGOE"],
["Class 10 Science Oswaal Questions Bank","https://vplink.in/Nrk4U9"],
["Class 10th S Chand Science Part 1 Physics","https://vplink.in/0qW8a"],
["Class_10_Social_Science_Oswaal_Sample_Question_Paper","https://vplink.in/gKSf"],
["Complete NCERT Exemplar Class 10","https://vplink.in/IRiXpE"],
["Copy of Educart Maths SPQ","https://vplink.in/lXBQo"],
["Educart Social Science Question Bank Class 10 CBSE 2025","https://vplink.in/1okzY"],
["Kriti Sharma English 360","https://vplink.in/IXpH"],
["MATHEMATICS MADE EASY BY RITIK MISHRA (PW)","https://vplink.in/jL7ka"],
["Maths PW Question Bank (2026)","https://vplink.in/j9f42"],
["PW ENGLISH QCB 2026 (Part-1)","https://vplink.in/QFvs"],
["PW REAL FEEL SAMPLE PAPERS CLASS 10","https://vplink.in/LPXfw5"],
["PW Social Science Sample Paper Class 10","https://vplink.in/F348"],
["RD Sharma Class 10","https://vplink.in/MgN0T"],
["S.Chand Science Class 10 Chemistry","https://vplink.in/I3QOD"],
["Science Oswaal QB 2026-27","https://vplink.in/uay4"],
["Social Science 360 By Kriti Sharma","https://vplink.in/1oHa"],
["SST CLASS 10 ALL IN ONE ARIHANT","https://vplink.in/45n6q"]
];

const grid=document.getElementById("bookGrid");
const search=document.getElementById("bookSearch");
const count=document.getElementById("bookCount");
const noResults=document.getElementById("noResults");

function renderBooks(){
  const query=search.value.trim().toLowerCase();
  const filtered=books.map((book,index)=>({
    name:book[0],url:book[1],index
  })).filter(book=>book.name.toLowerCase().includes(query));

  grid.innerHTML=filtered.map(book=>`
    <article class="book">
      <span class="number">${String(book.index+1).padStart(2,"0")}</span>
      <div class="book-info">
        <div class="book-name">${book.name}</div>
        <div class="book-type">Class 10 · Study Material</div>
      </div>
      <a class="launch" href="${book.url}" target="_blank"
        rel="noopener noreferrer">LAUNCH ↗</a>
    </article>
  `).join("");

  count.textContent=`${filtered.length} OF ${books.length} BOOKS`;
  noResults.style.display=filtered.length?"none":"block";
}

search.addEventListener("input",renderBooks);
document.getElementById("year").textContent=new Date().getFullYear();
renderBooks();
</script>
</body>
</html>
